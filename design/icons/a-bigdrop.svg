<?xml version="1.0" encoding="UTF-8"?>
<!--
  01「湛蓝水滴」 a-bigdrop
  一颗占满画面的大水滴，白→冰蓝渐变滴身 + 一道细波。
  构图饱满，语义最直接：水大的水，课表的 App。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FC3FF"/>
      <stop offset="1" stop-color="#1B5FD8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(170 130) scale(230 200)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBE6FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgA)"/>
  <rect width="512" height="512" fill="url(#glowA)"/>
  <path fill="url(#dropA)"
        d="M256,100 C216,158 166,222 166,290 A90,90 0 0 0 346,290 C346,222 296,158 256,100 Z"/>
  <path fill="none" stroke="#A9D4FF" stroke-width="16" stroke-linecap="round"
        d="M208,310 C224,292 240,292 256,310 S288,328 304,310"/>
</svg>

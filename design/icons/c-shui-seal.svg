<?xml version="1.0" encoding="UTF-8"?>
<!--
  03「水 · 圆窗」 c-shui-seal
  白色细环 + 大字「水」，旧式大学徽章的极简版：低调、书卷气。
  上线前文字需转曲（推荐思源黑体 Bold，SIL OFL 许可）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D5DE4"/>
      <stop offset="1" stop-color="#0A3690"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgC)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="10"/>
  <text x="256" y="344" text-anchor="middle" fill="#FFFFFF"
        font-family="'Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-weight="700" font-size="250">水</text>
</svg>

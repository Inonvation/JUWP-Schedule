<?xml version="1.0" encoding="UTF-8"?>
<!--
  06「玻璃水波」 f-glass
  玻璃拟态：一块半透明圆角玻璃浮在蓝渐变上，
  片面两道白波 + 一轮小日（水 + 电）。最「iOS 味」的一案。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC9FF"/>
      <stop offset="1" stop-color="#1257D6"/>
    </linearGradient>
    <radialGradient id="glowF" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(160 120) scale(240 210)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgF)"/>
  <rect width="512" height="512" fill="url(#glowF)"/>
  <rect x="136" y="136" width="240" height="240" rx="64"
        fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5"/>
  <path fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="9" stroke-linecap="round"
        d="M164,214 Q256,178 348,214"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round">
    <path d="M160,248 C180,224 204,224 224,248 S264,272 284,248"/>
    <path d="M160,288 C180,264 204,264 224,288 S264,312 284,288"/>
  </g>
  <circle cx="326" cy="268" r="24" fill="#FFFFFF"/>
</svg>

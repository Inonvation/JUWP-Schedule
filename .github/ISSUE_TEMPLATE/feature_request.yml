name: 新增功能 / 功能建议
description: 提一个新功能，或对现有功能的改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > 本项目只适配**江西水利电力大学**，暂无适配其他学校的计划。想给自己学校做定制版，请先看 [DEVELOPER.md](https://github.com/Inonvation/JUWP-Schedule/blob/main/DEVELOPER.md) 的「换一所学校：适配指南」。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下觉得不方便？现在是怎么凑合的？
      placeholder: 例如：取快递要在拼多多和淘宝之间来回切，想在一个地方看全部取件码。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的效果
      description: 希望 App 怎么做？有具体交互或界面想法的话，欢迎描述或贴草图
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 相关模块（可选）
      description: 如果这个建议属于某个已有功能，选一下；全新的功能选第一项
      options:
        - 不属于任何现有模块
        - 课表
        - 成绩 · 考试 · 学业
        - 选课
        - 笔记 · 作业
        - 收件箱
        - 一卡通（余额 / 付款码 / 流水）
        - 寝室电费
        - 胖乖生活（开水）
        - 趣智校园（热水）
        - 快趣出行（共享单车）
        - U净（洗衣房）
        - 取快递快捷方式
        - 教务网页 / 校历 / 请假 / 宿舍报修
        - 桌面小组件
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 补充说明 / 替代方案（可选）
      description: 其他实现思路、别的 App 里见过的做法、参考链接等
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，确认没有重复
          required: true
        - label: 我了解本项目只适配江西水利电力大学
          required: true

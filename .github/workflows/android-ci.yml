name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 依赖与 wrapper 缓存：Public repo 免 secrets，Gradle 8.10.2 wrapper 直接可用
      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest

      - name: 组装 Debug APK
        run: ./gradlew :app:assembleDebug

      # R8 的问题不在编译期暴露（AGENTS.md 记了三个坑），只跑 debug 挡不住整类问题。
      # CI 上没有 keystore.properties，build.gradle.kts 会回退 debug 签名并打一条 warning，构建照样过。
      - name: 组装 Release APK（R8 冒烟）
        run: ./gradlew :app:assembleRelease

      - name: 上传测试报告（失败时定位用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
